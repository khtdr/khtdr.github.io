baseURL = 'https://khtdr.com/'
locale = 'en-us'
title = 'KHTDR'
uglyurls = true
markup.highlight.noClasses = false
markup.goldmark.renderer.unsafe = true
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
[params.author]
  name = 'Joey Mazzarelli'
  email = 'mazzarelli@gmail.com'
[security]
  # Newer Hugo blocks org content by default, and half this site is org.
  allowContent = ['! ^text/html$']
